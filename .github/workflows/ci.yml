name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # A workflow that fails to PARSE reports nothing at all -- no red cross, no
  # run, just silence that reads exactly like success. actionlint is the only
  # thing that catches it, so it is the first lane here.
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

  gofmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # ⛔ This MUST be at least the go directive in go.mod. setup-go sets
          # GOTOOLCHAIN=local, so a pin below the directive does not quietly
          # download a newer toolchain -- it fails with "go.mod requires go >=
          # ...", on a commit that touched no Go code.
          go-version: '1.27.4'
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt-clean:"; echo "$unformatted"
            exit 1
          fi
      # ⛔ `go mod tidy -diff`, not `go mod tidy` followed by `git diff
      # go.mod go.sum`: this module has NO dependencies, so there is no
      # go.sum, and asking git to diff a path that does not exist fails with
      # "no such path in the working tree" and exit 128. That reads as an
      # untidy module when the module is fine — and because the step lives in
      # a job named gofmt, it reads as a FORMATTING failure, which it also is
      # not. -diff asks the question directly and writes nothing.
      - name: go.mod is tidy
        run: go mod tidy -diff

  # Nothing here is platform-specific, so nothing gets a pass for being one:
  # the same tests and the same coverage gate on all three.
  test:
    name: test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
      - run: CGO_ENABLED=0 go vet ./...
        shell: bash
      - run: CGO_ENABLED=0 go test -count=1 -coverprofile=cover.out ./...
        shell: bash
      - run: CGO_ENABLED=1 go test -race -count=1 ./...
        shell: bash
      # ⛔ 88%, and the number is argued rather than chosen. Measured 89.8% on
      # 2026-11-15, so there are under two points of slack and no more.
      #
      # What is NOT covered, named so the gap is a known one rather than a
      # mystery: the error returns that need a MALFORMED container. A track
      # whose sample rate changes mid-stream, a PCM chunk that is not a whole
      # number of frames, a track declaring a timescale of zero. Reaching
      # those means hand-building broken containers byte by byte, which is
      # worth doing and is not worth faking with a mock that proves only that
      # the mock works.
      #
      # Note what IS covered and was not obvious: every PCM sample width goes
      # through a real generated WAV, not just through PCMValue, because the
      # arithmetic and the width DERIVATION are different claims and only one
      # of them had any authority behind it.
      #
      # ⚠ A floor only works if it RATCHETS. If this number ever needs
      # lowering, that is the finding, not the fix.
      - name: coverage floor
        shell: bash
        run: |
          go tool cover -func=cover.out | tee cov.txt
          total=$(awk '/^total:/ {print substr($3, 1, length($3)-1)}' cov.txt)
          echo "total coverage: ${total}%"
          if awk -v t="$total" 'BEGIN { exit !(t < 88.0) }'; then
            echo "::error::coverage ${total}% is below the 88% floor"; exit 1
          fi

  cross:
    name: cross ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: linux, goarch: riscv64 }
          - { goos: linux, goarch: loong64 }
          - { goos: linux, goarch: ppc64le }
          - { goos: linux, goarch: s390x }
          - { goos: windows, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: freebsd, goarch: amd64 }
          - { goos: js, goarch: wasm }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
      - run: CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build ./...
      - run: CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go vet ./...

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...
